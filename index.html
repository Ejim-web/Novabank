<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Novabank · Premium Digital Banking</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Novabank Brand Colors */
        :root {
            --primary: #0b1f3a;
            --gold: #d4af37;
            --gold-light: #f6d365;
            --gold-dark: #b8860b;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            background: #f0f4fe;
            color: #0b1f3a;
            min-height: 100vh;
        }

        /* Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 20, 50, 0.08);
        }

        .glass-dark {
            background: rgba(10, 20, 40, 0.5);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* Gold Gradient Button */
        .btn-gold {
            background: linear-gradient(145deg, var(--gold-light), var(--gold-dark));
            color: #fff;
            font-weight: 600;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }

        .btn-gold:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 28px -8px rgba(184, 134, 11, 0.4);
        }

        /* Brand Background */
        .brand-bg {
            background: var(--primary);
        }

        .brand-gold {
            color: var(--gold);
        }

        /* Sidebar */
        .sidebar {
            background: var(--primary);
            color: #fff;
            width: 260px;
            min-height: 100vh;
            transition: width 0.3s ease;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 30;
        }

        .sidebar.collapsed {
            width: 72px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            color: rgba(255, 255, 255, 0.7);
        }

        .sidebar-item:hover {
            background: rgba(212, 175, 55, 0.08);
            color: #fff;
        }

        .sidebar-item.active {
            background: rgba(212, 175, 55, 0.12);
            border-left-color: var(--gold);
            color: #fff;
        }

        .sidebar-item i {
            width: 24px;
            text-align: center;
            color: var(--gold);
        }

        /* Confetti */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Fade In */
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #e8ecf1;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 20px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                min-height: auto;
                position: relative;
            }
            .sidebar.collapsed {
                width: 100%;
            }
        }

        /* Blue-Gold Gradient Card */
        .blue-gold-card {
            background: linear-gradient(145deg, #0a2a5e, #1e4b7a, #c9a84c);
            background-size: 200% 200%;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .card-shine {
            position: relative;
            overflow: hidden;
        }

        .card-shine::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Welcome Popup */
        .welcome-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        .welcome-box {
            background: rgba(11, 31, 58, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 32px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            color: #fff;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            position: relative;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>

    <script>
        // ============================================================
        //  NOVABANK - Complete Digital Banking Platform
        //  React SPA with Mock Backend (Firebase-ready)
        // ============================================================

        const { useState, useEffect, createContext, useContext } = React;

        // ---------- MOCK DATABASE (Replace with Firebase) ----------
        const DB = {
            users: [{
                id: '1',
                firstName: 'James',
                lastName: 'Carter',
                email: 'james@novabank.com',
                password: 'Password123!',
                phone: '+1 234 567 890',
                kycVerified: true,
                balance: 24500.75,
                savings: 8200.00,
                current: 4500.00,
                fixed: 15000.00,
                investment: 6800.00,
                avatar: 'https://ui-avatars.com/api/?name=James+Carter&background=0b1f3a&color=d4af37&size=128',
                lastLogin: '2026-07-30 14:23:10',
                notifications: 3,
                currency: 'USD',
                role: 'user'
            }, {
                id: '2',
                firstName: 'Admin',
                lastName: 'Novabank',
                email: 'admin@novabank.com',
                password: 'AdminPass123!',
                role: 'admin',
                kycVerified: true,
                balance: 0,
                avatar: 'https://ui-avatars.com/api/?name=Admin+Novabank&background=0b1f3a&color=d4af37&size=128',
                notifications: 0
            }],
            transactions: [
                { id: 't1', date: '2026-07-31', description: 'Starbucks Coffee', amount: -12.50, type: 'debit' },
                { id: 't2', date: '2026-07-30', description: 'Monthly Salary', amount: 4200.00, type: 'credit' },
                { id: 't3', date: '2026-07-29', description: 'Transfer to John Doe', amount: -200.00, type: 'debit' },
                { id: 't4', date: '2026-07-28', description: 'Dividend Payment', amount: 150.25, type: 'credit' },
                { id: 't5', date: '2026-07-27', description: 'Netflix Subscription', amount: -15.99, type: 'debit' }
            ],
            cards: [
                { id: 'c1', last4: '3456', type: 'Visa', brand: 'Visa', frozen: false, expiry: '12/28' },
                { id: 'c2', last4: '7890', type: 'Mastercard', brand: 'Mastercard', frozen: true, expiry: '09/27' }
            ],
            loans: [
                { id: 'l1', type: 'Personal', amount: 5000, status: 'active', nextPayment: '2026-08-15' }
            ]
        };

        let sessionUser = null;

        function mockLogin(email, password) {
            const user = DB.users.find(u => u.email === email && u.password === password);
            if (user) {
                sessionUser = { ...user };
                return { success: true, user: sessionUser };
            }
            return { success: false, message: 'Invalid email or password' };
        }

        function mockLogout() {
            sessionUser = null;
            localStorage.removeItem('novabank_session');
        }

        // ---------- APP CONTEXT ----------
        const AppContext = createContext(null);

        // ---------- MAIN APP ----------
        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [darkMode, setDarkMode] = useState(false);
            const [page, setPage] = useState('dashboard');
            const [showWelcome, setShowWelcome] = useState(false);
            const [welcomeData, setWelcomeData] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('novabank_session');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        const found = DB.users.find(u => u.email === parsed.email);
                        if (found) {
                            setUser(found);
                            setPage('dashboard');
                            setTimeout(() => triggerWelcome(found), 500);
                        }
                    } catch (e) {}
                }
                setLoading(false);
            }, []);

            const triggerWelcome = (usr) => {
                const now = new Date();
                setWelcomeData({
                    firstName: usr.firstName,
                    photo: usr.avatar,
                    date: now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric',
                        year: 'numeric' }),
                    time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                    lastLogin: usr.lastLogin || 'First time login',
                    balance: usr.balance || 0,
                    unread: usr.notifications || 0,
                });
                setShowWelcome(true);

                // Confetti
                const colors = ['#d4af37', '#f6d365', '#b8860b', '#0b1f3a', '#ffffff', '#ff6b6b', '#48dbfb'];
                for (let i = 0; i < 50; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.className = 'confetti-piece';
                        el.style.left = Math.random() * 100 + 'vw';
                        el.style.background = colors[Math.floor(Math.random() * colors.length)];
                        el.style.width = (Math.random() * 8 + 4) + 'px';
                        el.style.height = (Math.random() * 8 + 4) + 'px';
                        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 3500);
                    }, i * 60);
                }

                setTimeout(() => setShowWelcome(false), 6000);
            };

            const handleLogin = (email, pass) => {
                const res = mockLogin(email, pass);
                if (res.success) {
                    setUser(res.user);
                    localStorage.setItem('novabank_session', JSON.stringify({ email: res.user.email }));
                    setPage('dashboard');
                    triggerWelcome(res.user);
                } else {
                    alert('❌ ' + res.message);
                }
            };

            const handleLogout = () => {
                mockLogout();
                setUser(null);
                setPage('home');
            };

            if (loading) {
                return (
                    <div className="min-h-screen brand-bg flex items-center justify-center">
                        <div className="text-center">
                            <i className="fas fa-spinner fa-spin text-5xl text-[#d4af37]"></i>
                            <p className="text-white mt-4 text-lg">Novabank loading...</p>
                        </div>
                    </div>
                );
            }

            // Public Pages
            if (!user) {
                if (page === 'login') return <LoginPage onLogin={handleLogin} goHome={() => setPage('home')} />;
                if (page === 'register') return <RegisterPage goLogin={() => setPage('login')} />;
                return <HomePage goLogin={() => setPage('login')} goRegister={() => setPage('register')} />;
            }

            // Authenticated
            return (
                <AppContext.Provider value={{ user, setUser, darkMode, setDarkMode, logout: handleLogout }}>
                    <div className={`min-h-screen ${darkMode ? 'bg-[#0a1428] text-white' : 'bg-[#f0f4fe] text-[#0b1f3a]'}`}>
                        <div className="flex flex-col md:flex-row">
                            <Sidebar user={user} setPage={setPage} page={page} />
                            <div className="flex-1 flex flex-col min-h-screen">
                                <TopBar user={user} setPage={setPage} page={page} />
                                <main className="flex-1 p-4 md:p-6 overflow-y-auto">
                                    {page === 'dashboard' && <Dashboard user={user} />}
                                    {page === 'send' && <SendMoney user={user} />}
                                    {page === 'cards' && <Cards user={user} />}
                                    {page === 'transactions' && <Transactions user={user} />}
                                    {page === 'profile' && <Profile user={user} />}
                                    {page === 'admin' && user.role === 'admin' && <AdminPanel user={user} />}
                                    {page === 'loans' && <Loans user={user} />}
                                    {page === 'investments' && <Investments user={user} />}
                                    {page === 'beneficiaries' && <Beneficiaries user={user} />}
                                    {page === 'statements' && <Statements user={user} />}
                                    {page === 'support' && <Support user={user} />}
                                    {page === 'settings' && <Settings user={user} />}
                                    {!['dashboard', 'send', 'cards', 'transactions', 'profile', 'admin', 'loans',
                                            'investments', 'beneficiaries', 'statements', 'support', 'settings'
                                        ].includes(page) &&
                                        <div className="p-10 text-center">
                                            <i className="fas fa-construction text-5xl text-[#d4af37]"></i>
                                            <p className="mt-4 text-lg">Page coming soon</p>
                                        </div>
                                    }
                                </main>
                            </div>
                        </div>

                        {/* Welcome Popup */}
                        {showWelcome && welcomeData && (
                            <div className="welcome-overlay" onClick={() => setShowWelcome(false)}>
                                <div className="welcome-box" onClick={(e) => e.stopPropagation()}>
                                    <div className="absolute -top-4 -right-4">
                                        <i className="fas fa-crown text-3xl text-[#d4af37]"></i>
                                    </div>
                                    <img src={welcomeData.photo} className="w-24 h-24 rounded-full mx-auto border-4 border-[#d4af37] shadow-xl" />
                                    <h2 className="text-2xl font-bold mt-4">👋 Welcome Back, {welcomeData.firstName}!</h2>
                                    <p className="text-sm opacity-80 mt-1">Welcome to Novabank. Your account is secure and ready.</p>
                                    <div className="grid grid-cols-2 gap-3 mt-4 text-sm bg-white/10 p-4 rounded-xl">
                                        <div><i className="far fa-calendar mr-1"></i> {welcomeData.date}</div>
                                        <div><i className="far fa-clock mr-1"></i> {welcomeData.time}</div>
                                        <div><i className="fas fa-history mr-1"></i> Last: {welcomeData.lastLogin}</div>
                                        <div><i className="fas fa-wallet mr-1"></i> ${welcomeData.balance.toFixed(2)}</div>
                                    </div>
                                    <div className="mt-4 flex justify-between items-center">
                                        <span><i className="fas fa-bell text-[#d4af37] mr-1"></i> {welcomeData.unread} unread</span>
                                        <button onClick={() => setShowWelcome(false)} className="btn-gold px-6 py-2 rounded-full text-sm">
                                            Continue <i className="fas fa-arrow-right ml-1"></i>
                                        </button>
                                    </div>
                                    <button onClick={() => setShowWelcome(false)} className="absolute top-3 right-4 text-white/50 hover:text-white">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </AppContext.Provider>
            );
        }

        // ---------- SIDEBAR ----------
        function Sidebar({ user, setPage, page }) {
            const [collapsed, setCollapsed] = useState(false);
            const items = [
                { id: 'dashboard', icon: 'fa-gauge-high', label: 'Dashboard' },
                { id: 'send', icon: 'fa-paper-plane', label: 'Send Money' },
                { id: 'cards', icon: 'fa-credit-card', label: 'Cards' },
                { id: 'transactions', icon: 'fa-arrows-spin', label: 'Transactions' },
                { id: 'loans', icon: 'fa-hand-holding-dollar', label: 'Loans' },
                { id: 'investments', icon: 'fa-chart-line', label: 'Investments' },
                { id: 'beneficiaries', icon: 'fa-users', label: 'Beneficiaries' },
                { id: 'statements', icon: 'fa-file-pdf', label: 'Statements' },
                { id: 'support', icon: 'fa-headset', label: 'Support' },
                { id: 'settings', icon: 'fa-gear', label: 'Settings' },
            ];
            if (user.role === 'admin') items.push({ id: 'admin', icon: 'fa-shield', label: 'Admin' });

            return (
                <div className={`sidebar ${collapsed ? 'collapsed' : ''}`}>
                    <div className="p-4 flex items-center justify-between border-b border-white/10">
                        {!collapsed && (
                            <span className="text-xl font-bold tracking-wider">
                                <i className="fas fa-rocket text-[#d4af37] mr-2"></i>Novabank
                            </span>
                        )}
                        <button onClick={() => setCollapsed(!collapsed)} className="text-white/60 hover:text-white text-lg">
                            <i className={`fas ${collapsed ? 'fa-chevron-right' : 'fa-chevron-left'}`}></i>
                        </button>
                    </div>
                    <div className="py-3">
                        {items.map(item => (
                            <div
                                key={item.id}
                                onClick={() => setPage(item.id)}
                                className={`sidebar-item ${page === item.id ? 'active' : ''} ${collapsed ? 'justify-center' : ''}`}
                            >
                                <i className={`fas ${item.icon}`}></i>
                                {!collapsed && <span>{item.label}</span>}
                            </div>
                        ))}
                    </div>
                    <div className="absolute bottom-0 w-full p-4 border-t border-white/10">
                        <div className={`flex items-center ${collapsed ? 'justify-center' : ''} gap-3`}>
                            <img src={user.avatar} className="w-9 h-9 rounded-full border-2 border-[#d4af37]" />
                            {!collapsed && (
                                <div className="text-sm">
                                    <p className="font-semibold">{user.firstName} {user.lastName}</p>
                                    <p className="text-xs opacity-60">{user.email}</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- TOP BAR ----------
        function TopBar({ user, setPage, page }) {
            const { darkMode, setDarkMode, logout } = useContext(AppContext);
            const hour = new Date().getHours();
            const timeGreeting = hour < 12 ? 'Morning' : hour < 17 ? 'Afternoon' : 'Evening';

            return (
                <div className={`p-4 flex items-center justify-between border-b ${darkMode ? 'border-white/10' : 'border-gray-200'} bg-opacity-80 backdrop-blur-sm sticky top-0 z-20`}>
                    <div className="flex items-center gap-3">
                        <span className="text-xl font-bold md:hidden"><i className="fas fa-rocket text-[#d4af37]"></i> Novabank</span>
                        <span className="hidden md:block text-sm font-medium">
                            <i className="fas fa-clock text-[#d4af37] mr-1"></i> Good {timeGreeting}, {user.firstName}
                        </span>
                    </div>
                    <div className="flex items-center gap-4">
                        <div className="relative hidden md:block">
                            <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                            <input
                                type="text"
                                placeholder="Search..."
                                className="bg-transparent border-b border-gray-300 focus:border-[#d4af37] outline-none px-8 py-1 text-sm"
                            />
                        </div>
                        <button className="relative hover:scale-105 transition">
                            <i className="fas fa-bell text-xl"></i>
                            <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center font-bold">3</span>
                        </button>
                        <button onClick={() => setDarkMode(!darkMode)} className="hover:scale-105 transition">
                            <i className={`fas ${darkMode ? 'fa-sun' : 'fa-moon'} text-xl`}></i>
                        </button>
                        <button onClick={logout} className="text-sm bg-red-500/20 hover:bg-red-500/30 px-3 py-1.5 rounded-full transition flex items-center gap-1">
                            <i className="fas fa-sign-out-alt"></i>
                            <span className="hidden md:inline">Logout</span>
                        </button>
                    </div>
                </div>
            );
        }

        // ---------- DASHBOARD ----------
        function Dashboard({ user }) {
            const now = new Date();
            const hour = now.getHours();
            let greeting, icon;
            if (hour < 12) { greeting = 'Good Morning';
                icon = '☀️'; } else if (hour < 17) { greeting = 'Good Afternoon';
                icon = '🌤️'; } else if (hour < 21) { greeting = 'Good Evening';
                icon = '🌇'; } else { greeting = 'Good Night';
                icon = '🌙'; }

            const quickActions = [
                { label: 'Send Money', icon: 'fa-paper-plane' },
                { label: 'Transfer', icon: 'fa-arrow-right-arrow-left' },
                { label: 'Pay Bills', icon: 'fa-bolt' },
                { label: 'Deposit', icon: 'fa-circle-dollar' },
                { label: 'Cards', icon: 'fa-credit-card' },
            ];

            return (
                <div className="fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
                        <h1 className="text-2xl md:text-3xl font-bold">
                            {icon} {greeting}, {user.firstName}!
                        </h1>
                        <div className="text-sm opacity-70 mt-1 md:mt-0">
                            <i className="far fa-calendar-alt mr-1"></i>
                            {now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}
                        </div>
                    </div>

                    {/* Quick Actions */}
                    <div className="grid grid-cols-3 md:grid-cols-5 gap-3 mb-6">
                        {quickActions.map((action, i) => (
                            <div key={i} className="glass p-3 rounded-xl text-center cursor-pointer hover:scale-105 transition-all hover:shadow-lg">
                                <i className={`fas ${action.icon} text-2xl text-[#d4af37]`}></i>
                                <p className="text-xs mt-1 font-medium">{action.label}</p>
                            </div>
                        ))}
                    </div>

                    {/* Balance Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <div className="blue-gold-card card-shine p-5 rounded-2xl text-white shadow-xl">
                            <p className="opacity-80 text-sm font-medium">Total Balance</p>
                            <p className="text-3xl font-bold">${user.balance.toFixed(2)}</p>
                            <p className="text-xs opacity-70 mt-2"><i className="fas fa-arrow-up text-green-300"></i> +2.5% this month</p>
                        </div>
                        <div className="glass p-5 rounded-2xl">
                            <p className="opacity-70 text-sm">Savings</p>
                            <p className="text-2xl font-bold">${user.savings.toFixed(2)}</p>
                        </div>
                        <div className="glass p-5 rounded-2xl">
                            <p className="opacity-70 text-sm">Current</p>
                            <p className="text-2xl font-bold">${user.current.toFixed(2)}</p>
                        </div>
